<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrômeda · SEI Platform</title>

    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <!-- Tema antes da primeira pintura: escolha salva, senão o escuro (mesma regra de src/lib/palette.js) -->
    <script>
      (function () {
        var p = "default";
        try {
          var s = localStorage.getItem("andromeda_palette");
          if (s === "default" || s === "mono" || s === "light") p = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-palette", p);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
